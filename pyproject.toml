[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "refgap"
version = "0.1.0"
description = "Training-free RefGAP reference-logit correction"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["jax"]

[project.optional-dependencies]
tests = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
